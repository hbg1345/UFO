      "WebPlan": <웹 자동화가 필요한 경우에만 포함하세요. 구체적인 함수 호출 계획을 배열로 작성하세요. 자연어가 아닌 함수 호출 형식으로 작성해야 합니다. 예시: [{{"function": "navigate_to_url", "args": {{"url": "https://www.google.com"}}}}, {{"function": "click_element", "args": {{"text": "검색", "element_type": "button"}}}}]. 지원하는 함수들: navigate_to_url, click_element, input_text, submit_form>
    }}

  - **중요**: WebAutomation 필드는 반드시 포함되어야 하며, 브라우저 관련 요청은 항상 true로 설정하세요.
  - **중요**: 모든 응답에는 반드시 WebAutomation 필드가 포함되어야 합니다.
